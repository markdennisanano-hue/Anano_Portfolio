<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; scroll-behavior: smooth; }
        body { background: #fcfaf2; color: #4a3b32; margin: 0; padding: 0; }
        nav { background: #4a3b32; padding: 15px; position: sticky; top: 0; display: flex; justify-content: space-between; }
        nav a { color: #f0e6d2; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .about { background: #f0e6d2; text-align: center; padding: 50px 20px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #4a3b32; object-fit: cover; }
        .section { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        h2 { border-bottom: 2px solid #d4bda7; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #ffffff; border: 1px solid #d4bda7; padding: 20px; text-align: center; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .card:hover { background: #f0e6d2; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 10px; }
        .modal-content { background: #ffffff; padding: 20px; border-radius: 5px; border: 3px solid #4a3b32; max-width: 400px; width: 100%; text-align: center; position: relative; }
        .close { position: absolute; top: 5px; right: 15px; font-size: 24px; cursor: pointer; }
        .preview { max-width: 100%; max-height: 200px; margin-top: 10px; border: 1px solid #d4bda7; }
        .links { margin-top: 15px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; text-decoration: none; font-weight: bold; border-radius: 3px; color: #4a3b32; background: #d4bda7; }
        .btn-dl { color: #f0e6d2; background: #4a3b32; }
    </style>
</head>
<body>

    <nav>
        <div style="color:#f0e6d2; font-weight:bold;">MDJA</div>
        <div>
            <a href="#about">About</a>
            <a href="#quizzes">Quizzes</a>
            <a href="#exams">Exams</a>
            <a href="#labs">Labs</a>
            <a href="#projects">Projects</a>
        </div>
    </nav>

    <div id="about" class="about">
        <img src="profile.jpg" class="profile-img" alt="Profile">
        <h1>Mark Dennis J. Anaño</h1>
        <h3>BSCS-3B</h3>
        <p>Cavite State University - Silang Campus</p>
    </div>

    <div id="quizzes" class="section">
        <h2>Quizzes</h2>
        <div class="grid">
            <div class="card" onclick="show('Quiz 1', 'quizz1.jpeg')">Quiz 1</div>
            <div class="card" onclick="show('Quiz 2', 'quiz2.png')">Quiz 2</div>
        </div>
    </div>

    <div id="exams" class="section">
        <h2>Examinations</h2>
        <div class="grid">
            <div class="card" onclick="show('Exam 1', 'exam1.pdf')">Exam 1</div>
            <div class="card" onclick="show('Exam 2', 'exam2.docx')">Exam 2</div>
        </div>
    </div>

    <div id="labs" class="section">
        <h2>Laboratory Activities</h2>
        <div class="grid">
            <div class="card" onclick="show('Lab 1', 'Activity1.docx.pdf')">Lab 1</div>
            <div class="card" onclick="show('Lab 2', 'Activity2.docx.pdf')">Lab 2</div>
        </div>
    </div>

    <div id="projects" class="section">
        <h2>Projects</h2>
        <div class="grid">
            <div class="card" onclick="show('Project 1', 'project1.jpg')">Project 1</div>
            <div class="card" onclick="show('Project 2', 'project2.png')">Project 2</div>
        </div>
    </div>

    <div id="pop" class="modal" onclick="hide(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="document.getElementById('pop').style.display='none'">&times;</span>
            <h3 id="popTitle"></h3>
            <div id="popView"></div>
            <div class="links">
                <a id="popBtnV" target="_blank" class="btn">View</a>
                <a id="popBtnD" download class="btn btn-dl">Download</a>
            </div>
        </div>
    </style>

    <script>
        function show(title, file) {
            document.getElementById('popTitle').innerText = title;
            const view = document.getElementById('popView');
            view.innerHTML = '';
            
            const ext = file.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) {
                const img = document.createElement('img');
                img.src = file;
                img.className = 'preview';
                view.appendChild(img);
            } else {
                view.innerText = file;
            }

            document.getElementById('popBtnV').href = file;
            document.getElementById('popBtnD').href = file;
            document.getElementById('popBtnD').setAttribute('download', file);
            document.getElementById('pop').style.display = 'flex';
        }
        function hide(e) {
            document.getElementById('pop').style.display = 'none';
        }
    </script>
</body>
</html>
