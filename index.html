<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; scroll-behavior: smooth; }
        body { background: #f0f8ff; color: #2a4b7c; margin: 0; padding: 0; }
        nav { background: #b0c4de; padding: 15px; position: sticky; top: 0; display: flex; justify-content: space-between; }
        nav a { color: #2a4b7c; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .about { background: #e6f2ff; text-align: center; padding: 40px 20px; border-bottom: 2px solid #b0c4de; }
        .profile-img { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #b0c4de; object-fit: cover; }
        .main-container { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .section-card { background: #ffffff; border: 2px solid #b0c4de; padding: 40px 20px; text-align: center; cursor: pointer; border-radius: 8px; font-size: 1.3rem; font-weight: bold; color: #2a4b7c; transition: 0.2s; }
        .section-card:hover { background: #e6f2ff; transform: translateY(-3px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; padding: 10px; z-index: 2000; }
        .modal-content { background: #ffffff; padding: 25px; border-radius: 8px; border: 3px solid #b0c4de; max-width: 450px; width: 100%; text-align: center; position: relative; max-height: 85vh; overflow-y: auto; }
        .close { position: absolute; top: 5px; right: 15px; font-size: 28px; cursor: pointer; color: #2a4b7c; }
        .file-box { background: #f0f8ff; border: 1px solid #b0c4de; padding: 15px; border-radius: 6px; margin-top: 15px; }
        .preview { max-width: 100%; max-height: 180px; margin: 10px 0; border-radius: 4px; border: 1px solid #b0c4de; }
        .links { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 8px; text-decoration: none; font-weight: bold; border-radius: 4px; text-align: center; font-size: 0.9rem; }
        .btn-v { background: #e6f2ff; color: #2a4b7c; border: 1px solid #b0c4de; }
        .btn-d { background: #2a4b7c; color: #ffffff; }
    </style>
</head>
<body>

    <nav>
        <div style="color:#2a4b7c; font-weight:bold; font-size:1.2rem;">MDJA</div>
        <div>
            <a href="#about">About</a>
            <a href="#portfolio">Portfolio</a>
        </div>
    </nav>

    <div id="about" class="about">
        <img src="profile.jpg" class="profile-img" alt="Profile">
        <h1 style="margin:10px 0 5px 0;">Mark Dennis J. Anaño</h1>
        <h3 style="margin:0; color:#557aaf;">BSCS-3B</h3>
        <p style="margin:5px 0 0 0;">Cavite State University - Silang Campus</p>
    </div>

    <div id="portfolio" class="main-container">
        <h2 style="text-align:center; border-bottom:2px solid #b0c4de; padding-bottom:10px;">Academic Sections</h2>
        <div class="grid">
            <div class="section-card" onclick="openSection('Quizzes', [{name:'Quiz 1', file:'quiz1.jpg'}, {name:'Quiz 2', file:'quiz2.png'}])">Quizzes</div>
            <div class="section-card" onclick="openSection('Examinations', [{name:'Exam 1', file:'exam1.pdf'}, {name:'Exam 2', file:'exam2.docx'}])">Examinations</div>
            <div class="section-card" onclick="openSection('Laboratory Activities', [{name:'Lab 1', file:'lab1.pdf'}, {name:'Lab 2', file:'lab2.pdf'}])">Laboratory Activities</div>
            <div class="section-card" onclick="openSection('Projects', [{name:'Project 1', file:'project1.jpg'}, {name:'Project 2', file:'project2.png'}])">Projects</div>
        </div>
    </div>

    <div id="pop" class="modal" onclick="document.getElementById('pop').style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="document.getElementById('pop').style.display='none'">&times;</span>
            <h2 id="popTitle" style="margin-top:0; color:#2a4b7c;"></h2>
            <div id="popList"></div>
        </div>
    </div>

    <script>
        function openSection(title, items) {
            document.getElementById('popTitle').innerText = title;
            const list = document.getElementById('popList');
            list.innerHTML = '';

            items.forEach(item => {
                const box = document.createElement('div');
                box.className = 'file-box';

                const name = document.createElement('h4');
                name.innerText = item.name;
                name.style.margin = '0';
                box.appendChild(name);

                const ext = item.file.split('.').pop().toLowerCase();
                if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                    const img = document.createElement('img');
                    img.src = item.file;
                    img.className = 'preview';
                    box.appendChild(img);
                }

                const links = document.createElement('div');
                links.className = 'links';

                const viewBtn = document.createElement('a');
                viewBtn.href = item.file;
                viewBtn.target = '_blank';
                viewBtn.className = 'btn btn-v';
                viewBtn.innerText = 'View';

                const dlBtn = document.createElement('a');
                dlBtn.href = item.file;
                dlBtn.download = item.file;
                dlBtn.className = 'btn btn-d';
                dlBtn.innerText = 'Download';

                links.appendChild(viewBtn);
                links.appendChild(dlBtn);
                box.appendChild(links);
                list.appendChild(box);
            });

            document.getElementById('pop').style.display = 'flex';
        }
    </script>
</body>
</html>
